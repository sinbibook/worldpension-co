<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- 렌더 게이트: 매핑 전 placeholder 깜빡임 방지 (매핑 완료 시 페이드인) -->
    <style>
      html.tpl-loading body {
        opacity: 0;
      }
      body {
        opacity: 1;
        transition: opacity 0.3s ease;
      }
    </style>
    <script>
      document.documentElement.classList.add('tpl-loading');
      window.__tplReveal = function () {
        document.documentElement.classList.remove('tpl-loading');
      };
      setTimeout(function () {
        window.__tplReveal && window.__tplReveal();
      }, 3000);
    </script>
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta property="og:type" content="website" />
    <title data-page-title>속초 월드 애견동반 (유료) 펜션 - 객실안내</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" type="text/css" href="styles/theme.css" />
    <link rel="stylesheet" type="text/css" href="styles/reset.css" />
    <link rel="stylesheet" type="text/css" href="styles/style.css" />
    <link
      rel="stylesheet"
      type="text/css"
      href="//cdn.jsdelivr.net/npm/swiper@8/swiper-bundle.min.css"
    />
    <!-- Open Graph Meta Tags for Social Media -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="속초 월드 애견동반 (유료) 펜션 - 객실안내" />
  <meta property="og:description" content="속초해수욕장 도보 1분 거리에 위치한 속초 월드 펜션입니다. 사랑하는 가족,연인,친구,반려견과 즐거운 여행을 보내세요." />
  <meta property="og:image" content="https://bookingplay-media.s3.amazonaws.com/item_images/2026/10/15/P1LGSQpCfDXr.jpg" />
  <meta property="og:url" content="https://worldpension.co.kr" />

  <!-- Twitter Card Meta Tags -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="속초 월드 애견동반 (유료) 펜션 - 객실안내" />
  <meta name="twitter:description" content="속초해수욕장 도보 1분 거리에 위치한 속초 월드 펜션입니다. 사랑하는 가족,연인,친구,반려견과 즐거운 여행을 보내세요." />
  <meta name="twitter:image" content="https://bookingplay-media.s3.amazonaws.com/item_images/2026/10/15/P1LGSQpCfDXr.jpg" />
  <meta name="naver-site-verification" content="e06af8608527e39b2ae9b90f5edf19c917ea84be" />
  <meta name="google-site-verification" content="Mgnk_J880xVKpN-zFjV7J69ZWFahx2Rwzp0V9rnMcJs" />
</head>

  <body oncontextmenu="return false;" onselectstart="return false" ondragstart="return false;">
    <div id="wrap">
      <div id="header-wrap"></div>

      <div id="container">
        <!-- 원본 room.html?room_id= (객실 상세). ?room_id= 없으면 첫 번째 객실을 보여준다.
             백오피스 preview 는 ?id= 로 보내므로 둘 다 받는다. -->
        <section id="content" class="sub2_2 sub_room sub_room_detail">
          <div class="sub_visual_wide visual">
            <div class="main_txt_top">
              <!-- 원본과 동일: span / strong 은 정적 라벨, p 에 객실명이 들어간다 -->
              <span>Room Information</span>
              <strong>Preview</strong>
              <!-- data-* 속성 : data-room-name (customFields.roomtypes[current].name) -->
              <p data-room-name></p>
            </div>
            <div class="arw_box">
              <div class="arw_left"><img src="images/spe_le.png" alt="이전" /></div>
              <div class="arw_right"><img src="images/spe_ri.png" alt="다음" /></div>
            </div>
            <a href="#" class="scroll_down"><img src="images/scroll_down.png" alt="스크롤" /></a>
            <div class="sub_visual_box">
              <div class="swiper-container">
                <!-- data-* 속성 : data-room-hero-slides | 동적 매핑 필요
                     roomtypes[current].images (category=roomtype_interior) 전체 -->
                <div class="swiper-wrapper" data-room-hero-slides></div>
              </div>
            </div>
          </div>
          <!--// sub_visual -->

          <div class="sub_cate_wrap">
            <div class="sub_inner">
              <!-- data-* 속성 : data-room-list-nav | 동적 매핑 필요
                   customFields.roomtypes[] → "미리보기" li 뒤에 객실 li 추가 (현재 객실 .on) -->
              <ul data-room-list-nav>
                <li><a href="./layout-map.html">미리보기</a></li>
                <!-- MAPPER: roomtypes[] 동적 생성 -->
              </ul>
            </div>
          </div>

          <div class="sub_cont">
            <div class="sub_inner">
              <div class="sub_title2">
                <!-- data-* 속성 : data-room-name -->
                <h3 data-room-name></h3>
                <p>객실 상세 정보를 안내해 드립니다.</p>
              </div>

              <div class="table_box">
                <!-- PC 표 -->
                <div class="price_table for_pc">
                  <table cellspacing="0" cellpadding="0" class="table_default">
                    <thead>
                      <tr>
                        <th style="width: 15%">객실명</th>
                        <th style="width: 5%">기준</th>
                        <th style="width: 5%">최대</th>
                        <th style="width: 20%">유형</th>
                        <th style="width: 20%">평형</th>
                      </tr>
                    </thead>
                    <tbody>
                      <tr>
                        <!-- data-* 속성 : data-room-name / -base-occupancy / -max-occupancy
                             / -structure / -size-pyeong -->
                        <td data-room-name></td>
                        <td data-room-base-occupancy></td>
                        <td data-room-max-occupancy></td>
                        <td data-room-structure></td>
                        <td data-room-size-pyeong></td>
                      </tr>
                    </tbody>
                  </table>
                  <ul class="table_text">
                    <li>
                      <strong>집기품목</strong>
                      :
                      <!-- data-* 속성 : data-room-amenities (rooms[j].amenities.join(', ')) -->
                      <span data-room-amenities></span>
                    </li>
                  </ul>
                </div>

                <!-- 모바일 표 (평형 열 없음) -->
                <div class="price_table for_m">
                  <table cellspacing="0" cellpadding="0" class="table_default">
                    <tbody>
                      <tr>
                        <td>객실명</td>
                        <td>기준</td>
                        <td>최대</td>
                        <td>유형</td>
                      </tr>
                      <tr>
                        <td data-room-name></td>
                        <td data-room-base-occupancy></td>
                        <td data-room-max-occupancy></td>
                        <td data-room-structure></td>
                      </tr>
                    </tbody>
                  </table>
                  <ul class="table_text">
                    <li>
                      <strong>집기품목</strong>
                      :
                      <span data-room-amenities></span>
                    </li>
                  </ul>
                </div>

                <div class="btn_wrap">
                  <!-- data-* 속성 : data-booking-url (property.realtimeBookingId) -->
                  <a href="#!" target="_blank" class="btn_reserve" data-booking-url>예약하기</a>
                </div>
              </div>
            </div>

            <!-- s: 교차 배너 #1 — interior 앞 2장 + 문구 -->
            <div class="sub_inner">
              <!-- data-* 속성 : data-room-bnr-images | 동적 매핑 필요 (li 2개 고정) -->
              <ul class="sub_img_box" data-room-bnr-images>
                <li class="img"></li>
                <li class="img"></li>
              </ul>
              <div class="txt_box">
                <!-- data-* 속성 : data-room-bnr-title (getPropertyNameEn() 고정)
                     원본과 동일하게 숙소 영문명이다. 객실명이 아니다. -->
                <strong data-room-bnr-title></strong>
                <!-- data-* 속성 : data-room-bnr-description
                     interior image.description → 폴백 BNR_FALLBACK_DESC_HTML -->
                <p data-room-bnr-description></p>
              </div>
            </div>

            <!-- s: 패럴랙스 밴드
                 ⚠️ .parallax-window 에 background-image 를 직접 주지 말 것
                    (.parallax-mirror 가 z-index:-100 이라 요소 자신의 배경에 가려진다) -->
            <div class="room_parallax">
              <!-- data-* 속성 : data-room-parallax (interior[2] → 폴백 thumbnail) -->
              <div class="parallax-window" data-parallax="scroll" data-room-parallax>
                <div class="spe_in_txt">
                  <div class="sub_inner">
                    <div class="txt_box">
                      <!-- data-* 속성 : data-index-closing-title
                           index.closing.title → 폴백 "Welcome to {getPropertyNameEn()}" -->
                      <strong data-index-closing-title></strong>
                      <!-- data-* 속성 : data-index-closing-description
                           index.closing.description → 폴백 CLOSING_FALLBACK_DESC_HTML -->
                      <p data-index-closing-description></p>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <!-- s: 교차 배너 #2 + 와이드 이미지 -->
            <div class="sub_inner">
              <!-- data-* 속성 : data-room-gallery | 동적 매핑 필요 (li 2개 고정) -->
              <ul class="sub_img_box sub_img_box_align" data-room-gallery>
                <li class="img"></li>
                <li class="img"></li>
              </ul>
              <div class="sub_img_box_wide">
                <!-- data-* 속성 : data-room-wide-image -->
                <div class="img" data-room-wide-image></div>
                <div class="txt_box">
                  <!-- data-* 속성 : data-room-hello-title
                       "Hello, {getPropertyNameEn()}" (원본 카피) -->
                  <strong data-room-hello-title></strong>
                  <!-- data-* 속성 : data-room-bnr-description
                       interior image.description → 폴백 BNR_FALLBACK_DESC_HTML -->
                  <p data-room-bnr-description></p>
                </div>
              </div>
            </div>

            <!-- s: 객실 평면도 — 원본 객실 상세의 평면도 영역 크롤링 이미지가 있을 때만 노출 -->
            <div class="room_floorplan" data-room-floorplan-section>
              <div class="sub_inner">
                <div class="sub_title2">
                  <h3>객실 평면도</h3>
                </div>
                <div class="floorplan_img">
                  <!-- data-* 속성 : data-room-floorplan-image
                       roomtypes[current] 평면도 크롤링 이미지 → 없으면 섹션 미노출 -->
                  <!-- ⚠️ `src` 를 비워 두지 않는다. `src=""` 는 브라우저가 현재 페이지를 다시 요청한다.
                       매퍼가 채우기 전까지 속성 자체를 두지 않는다. -->
                  <img alt="객실 평면도" data-room-floorplan-image />
                </div>
              </div>
            </div>
            <!--// 객실 평면도 -->

            <!-- s: main_room — 객실 미리보기 슬라이더 (index / layout-map 과 동일 구조) -->
            <div class="main_room">
              <div class="arw_box">
                <div class="arw_left"><img src="images/spe_le.png" alt="이전" /></div>
                <div class="arw_right"><img src="images/spe_ri.png" alt="다음" /></div>
              </div>
              <div class="room_list">
                <div class="main_title">
                  <h3>Room's Preview</h3>
                  <!-- data-* 속성 : data-property-caption ({name} → property.name) -->
                  <p data-property-caption="{name}의 객실을 소개합니다."></p>
                </div>
                <div class="swiper-container_special">
                  <!-- data-* 속성 : data-room-list-slides | 동적 매핑 필요
                       customFields.roomtypes[] × rooms[] id 매칭 -->
                  <div class="swiper-wrapper" data-room-list-slides></div>
                </div>
              </div>
            </div>
            <!--// main_room -->
          </div>
          <!--// sub_cont -->
        </section>
      </div>

      <div id="footer-wrap"></div>
    </div>

    <script src="//cdnjs.cloudflare.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/swiper@8/swiper-bundle.min.js"></script>
    <script src="js/parallax.js"></script>
    <script src="js/image-helpers.js"></script>
    <script src="js/preview-handler.js"></script>
    <script src="js/data-mapper/core/base-mapper.js"></script>
    <script src="js/data-mapper/pages/header-footer-mapper.js"></script>
    <script src="js/data-mapper/pages/room-mapper.js"></script>
    <script src="js/header-footer-loader.js"></script>
    <script src="js/common.js"></script>
    <script src="js/pages/room.js"></script>
  </body>
</html>
