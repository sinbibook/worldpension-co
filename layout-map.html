<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- 렌더 게이트: 매핑 전 placeholder 깜빡임 방지 (매핑 완료 시 페이드인) -->
    <style>
      html.tpl-loading body {
        opacity: 0;
      }
      body {
        opacity: 1;
        transition: opacity 0.3s ease;
      }
    </style>
    <script>
      document.documentElement.classList.add('tpl-loading');
      window.__tplReveal = function () {
        document.documentElement.classList.remove('tpl-loading');
      };
      setTimeout(function () {
        window.__tplReveal && window.__tplReveal();
      }, 3000);
    </script>
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta property="og:type" content="website" />
    <title data-page-title>속초 월드 애견동반 (유료) 펜션</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" type="text/css" href="styles/theme.css" />
    <link rel="stylesheet" type="text/css" href="styles/reset.css" />
    <link rel="stylesheet" type="text/css" href="styles/style.css" />
    <link
      rel="stylesheet"
      type="text/css"
      href="//cdn.jsdelivr.net/npm/swiper@8/swiper-bundle.min.css"
    />
    <!-- Open Graph Meta Tags for Social Media -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="속초 월드 애견동반 (유료) 펜션" />
  <meta property="og:description" content="속초해수욕장 도보 1분 거리에 위치한 속초 월드 펜션입니다. 사랑하는 가족,연인,친구,반려견과 즐거운 여행을 보내세요." />
  <meta property="og:image" content="https://bookingplay-media.s3.amazonaws.com/item_images/2026/10/15/P1LGSQpCfDXr.jpg" />
  <meta property="og:url" content="https://worldpension.co.kr" />

  <!-- Twitter Card Meta Tags -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="속초 월드 애견동반 (유료) 펜션" />
  <meta name="twitter:description" content="속초해수욕장 도보 1분 거리에 위치한 속초 월드 펜션입니다. 사랑하는 가족,연인,친구,반려견과 즐거운 여행을 보내세요." />
  <meta name="twitter:image" content="https://bookingplay-media.s3.amazonaws.com/item_images/2026/10/15/P1LGSQpCfDXr.jpg" />
  <meta name="naver-site-verification" content="e06af8608527e39b2ae9b90f5edf19c917ea84be" />
  <meta name="google-site-verification" content="Mgnk_J880xVKpN-zFjV7J69ZWFahx2Rwzp0V9rnMcJs" />
</head>

  <body oncontextmenu="return false;" onselectstart="return false" ondragstart="return false;">
    <div id="wrap">
      <div id="header-wrap"></div>

      <div id="container">
        <!-- 원본 room.html (room_id 없는 목록 화면). ROOMS 대메뉴의 랜딩이자 "미리보기" 링크 대상.
             백오피스 편집 화면 라벨은 "배치도 (선택)" — layoutMap.hero 가 페이지 히어로,
             layoutMap.about 이 하단 배치도 이미지에 대응한다. -->
        <section id="content" class="sub2_1 sub_room">
          <!-- data-* 속성 : data-layout-map-hero-bg
               pages.layoutMap.sections[0].hero.images[isSelected][0].url (background-image) -->
          <div class="sub_visual" data-layout-map-hero-bg>
            <div class="txt_box">
              <h3>ROOMS</h3>
              <!-- data-* 속성 : data-property-caption ({name} → property.name) -->
              <span data-property-caption="{name}, 객실 미리보기"></span>
            </div>
          </div>
          <!--// sub_visual -->

          <div class="sub_cate_wrap">
            <div class="sub_inner">
              <!-- data-* 속성 : data-room-list-nav | 동적 매핑 필요
                   customFields.roomtypes[] → "미리보기" li 뒤에 객실 li 추가 -->
              <ul data-room-list-nav>
                <li class="on"><a href="./layout-map.html">미리보기</a></li>
                <!-- MAPPER: roomtypes[] → <li><a href="./room.html?room_id={id}"> 동적 생성 -->
              </ul>
            </div>
          </div>

          <div class="sub_cont">
            <!-- s: main_room — 객실 슬라이더 (index.html 과 동일 구조) -->
            <div class="main_room">
              <div class="arw_box">
                <div class="arw_left"><img src="images/spe_le.png" alt="이전" /></div>
                <div class="arw_right"><img src="images/spe_ri.png" alt="다음" /></div>
              </div>
              <div class="room_list">
                <div class="main_title">
                  <h3>Room's Preview</h3>
                  <!-- data-* 속성 : data-property-caption -->
                  <p data-property-caption="{name}의 객실을 소개합니다."></p>
                </div>
                <div class="swiper-container_special">
                  <!-- data-* 속성 : data-room-list-slides | 동적 매핑 필요
                       customFields.roomtypes[] × rooms[] id 매칭 (index 와 동일) -->
                  <div class="swiper-wrapper" data-room-list-slides></div>
                </div>
              </div>
            </div>
            <!--// main_room -->

            <!-- s: 배치도 (layoutMap.about) — 이미지가 없으면 매퍼가 통째로 숨긴다.
                 원본 room.html 의 .layout_box 다. 제목은 --font-en-main 필기체 50px 정적 라벨이고
                 '객실 평면도' 가 아니다 — 평면도(roomtype_floorplan)는 room.html 전용이다. -->
            <div class="sub_inner" data-layout-map-wrap>
              <div class="sub_title">
                <h3>Room's Layout</h3>
                <!-- data-* 속성 : data-property-caption -->
                <p data-property-caption="{name} 배치도 안내입니다."></p>
              </div>
              <div class="sub_img_box_wide layout_map_wide">
                <!-- data-* 속성 : data-layout-map-image
                     pages.layoutMap.sections[0].about.images[isSelected][0].url
                     배치도는 도면이라 잘리면 안 되므로 background(cover) 가 아니라 <img> 로 넣는다 -->
                <img data-layout-map-image alt="배치도" />
              </div>
            </div>
            <!--// 배치도 -->
          </div>
          <!--// sub_cont -->
        </section>
      </div>

      <div id="footer-wrap"></div>
    </div>

    <script src="//cdnjs.cloudflare.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/swiper@8/swiper-bundle.min.js"></script>
    <script src="js/image-helpers.js"></script>
    <script src="js/preview-handler.js"></script>
    <script src="js/data-mapper/core/base-mapper.js"></script>
    <script src="js/data-mapper/pages/header-footer-mapper.js"></script>
    <script src="js/data-mapper/pages/layout-map-mapper.js"></script>
    <script src="js/header-footer-loader.js"></script>
    <script src="js/common.js"></script>
    <script src="js/pages/layout-map.js"></script>
  </body>
</html>
